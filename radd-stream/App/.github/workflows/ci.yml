name: 🔨 CI — Build & Test

# Runs on every push to any branch, and on pull requests
on:
  push:
    branches: ["**"]
    paths:
      - "App/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "App/**"

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK + Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK 17 ─────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ── 3. Cache Gradle & Android build outputs ───────────────────────
      - name: 📦 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            App/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('App/**/*.gradle.kts', 'App/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Make gradlew executable ────────────────────────────────────
      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x App/gradlew

      # ── 5. Run unit tests ─────────────────────────────────────────────
      - name: 🧪 Run unit tests
        working-directory: App
        run: ./gradlew test --stacktrace

      # ── 6. Run lint ───────────────────────────────────────────────────
      - name: 🔍 Run lint checks
        working-directory: App
        run: ./gradlew lint --stacktrace
        continue-on-error: true   # lint warnings don't fail the build

      # ── 7. Build debug APK ────────────────────────────────────────────
      - name: 🏗️ Build debug APK
        working-directory: App
        run: ./gradlew assembleDebug --stacktrace

      # ── 8. Upload debug APK as artifact ──────────────────────────────
      - name: 📤 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: App/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── 9. Upload lint report ─────────────────────────────────────────
      - name: 📤 Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: App/app/build/reports/lint-results-debug.html
          retention-days: 7

      # ── 10. Post build summary ────────────────────────────────────────
      - name: 📊 Build summary
        if: success()
        run: |
          APK_PATH="App/app/build/outputs/apk/debug/app-debug.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| APK size | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ Download the debug APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
