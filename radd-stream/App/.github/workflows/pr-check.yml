name: 🔍 PR Check — Compile & Lint

# Runs only on pull requests targeting main
on:
  pull_request:
    branches: [main]
    paths:
      - "App/**"

jobs:
  pr-check:
    name: PR Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      pull-requests: write   # to post comments on PRs

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            App/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('App/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 🔧 Grant execute permission
        run: chmod +x App/gradlew

      - name: 🧪 Run tests
        working-directory: App
        run: ./gradlew test --stacktrace

      - name: 🔍 Run lint
        working-directory: App
        run: ./gradlew lint --stacktrace

      - name: 🏗️ Build debug APK
        working-directory: App
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pr-debug-apk-${{ github.event.pull_request.number }}
          path: App/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: 💬 Post APK link as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ PR Build Passed\n\n📥 **[Download Debug APK](${runUrl})** (go to Artifacts section)\n\nThe APK will be available for 3 days.`
            });
