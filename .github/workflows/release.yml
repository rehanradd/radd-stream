name: 🚀 Release — Sign & Publish APK

# Triggers when you push a version tag like: v1.0.0, v1.2.3, v2.0.0-beta1
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK 17 ─────────────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ── 3. Set up Android SDK ────────────────────────────────────────
      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Cache Gradle ───────────────────────────────────────────────
      - name: 📦 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            App/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('App/**/*.gradle.kts', 'App/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 5. Gradlew permissions ────────────────────────────────────────
      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x App/gradlew

      # ── 6. Extract version from tag (e.g. v1.2.3 → 1.2.3) ───────────
      - name: 🏷️ Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Convert version to versionCode (e.g. 1.2.3 → 10203)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3 | cut -d- -f1)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📦 Building version $VERSION (code: $VERSION_CODE)"

      # ── 7. Run tests before release ───────────────────────────────────
      - name: 🧪 Run unit tests
        working-directory: App
        run: ./gradlew test --stacktrace

      # ── 8. Build signed release APK ───────────────────────────────────
      - name: 🏗️ Build signed release APK
        working-directory: App
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=$VERSION_NAME \
            -PversionCode=$VERSION_CODE \
            --stacktrace

      # ── 9. Rename the APK with version ────────────────────────────────
      - name: 📝 Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp App/app/build/outputs/apk/release/app-release.apk \
             App/app/build/outputs/apk/release/radd-stream-${VERSION}.apk

      # ── 10. Get APK size for release notes ────────────────────────────
      - name: 📊 Get APK size
        id: apk_info
        run: |
          SIZE=$(du -sh App/app/build/outputs/apk/release/radd-stream-${{ steps.version.outputs.version }}.apk | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      # ── 11. Create GitHub Release with APK ────────────────────────────
      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "RADD Stream ${{ steps.version.outputs.tag }}"
          body: |
            ## 📱 RADD Stream ${{ steps.version.outputs.tag }}

            ### 📥 Installation
            1. Download **radd-stream-${{ steps.version.outputs.version }}.apk** below
            2. On your Android phone: open the file to install
            3. If prompted, enable **"Install from unknown sources"** in settings
            4. Open RADD Stream → enter your server URL → enjoy!

            ### ℹ️ Build Info
            | Item | Value |
            |---|---|
            | Version | `${{ steps.version.outputs.version }}` |
            | Version Code | `${{ steps.version.outputs.version_code }}` |
            | APK Size | ${{ steps.apk_info.outputs.size }} |
            | Min Android | 5.0 (API 21) |
            | Commit | `${{ github.sha }}` |
            | Built by | GitHub Actions (Ubuntu) |

            ### 🔒 Verification
            This APK is signed with the RADD Stream release keystore and built directly from source via GitHub Actions. No manual steps involved.
          files: |
            App/app/build/outputs/apk/release/radd-stream-${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'alpha') || contains(steps.version.outputs.tag, 'rc') }}
