name: 🐍 Backend CI — Stdlib Python Tests

# WHAT THIS DOES
#   Protects the Fast_Fetch data layer with the same rigor as the app: runs the
#   offline suites below on a plain ubuntu runner using the system python3
#   with -S and NO pip install whatsoever (stdlib-only is project law; if a
#   suite ever needs pip, that is a regression of the law, not of the runner).
#
#   Suites run (verified passing offline on the Oracle VM, python 3.12, before
#   this workflow was written):
#     - Fast_Fetch/test_database.py          (catalog/DB + adult filtering)
#     - Fast_Fetch/test_vidout.py            (VIDOUT extractor tests)
#     - Fast_Fetch/test_catalog_v2.py        (v2 catalog projection)
#     - Fast_Fetch/test_release_descriptor.py(release descriptor parsing)
#     - Fast_Fetch/test_link_health.py       (link health prober; binds a
#                                             throwaway HTTP server on 127.0.0.1
#                                             only — NO external network)
#     - Fast_Fetch/test_link_state.py        (ledger verdicts + cat_links propagation)
#     - Fast_Fetch/test_evidence_writeback.py(probe evidence folded onto cat_links)
#     - Fast_Fetch/test_api_v2.py            (every /api/v2 route head)
#     - Fast_Fetch/test_redact.py            (deny-by-default provenance edge)
#     - Fast_Fetch/test_tiers.py             (one winner per quality band)
#     - Fast_Fetch/test_catalog_api.py       (v1 read layer)
#     - Fast_Fetch/test_provenance_stamping.py(ingest-time provenance)
#     - Fast_Fetch/test_merge_catalogs.py    (staging → unified merge)
#     - Fast_Fetch/test_site_scout.py        (site discovery / spec phases)
#     - Fast_Fetch/test_backup_manager.py    (offsite backup tooling)
#   Phase-1 additions (crown order qoder12_cigate — these modules existed in
#   NO gate before; a change could break them and still show a green tick):
#     - Fast_Fetch/test_resolved_cache.py    (JIT cache: serving rules, cold-start
#                                             race, evidence-guarded failure circuit)
#     - Fast_Fetch/test_host_classifier.py   (single host-trust authority, AND rule)
#     - Fast_Fetch/test_catalog_exporter.py  (static export + adult reconciliation)
#     - Fast_Fetch/test_domain_resolver.py   (live-domain registry writer)
#     - Fast_Fetch/test_fast_fetch_domains.py(qoder14: static/DB domain drift)
#     - Fast_Fetch/test_ci_manifest.py       (drift guard: fails if any top-level
#                                             test_*.py is neither run here nor
#                                             EXCLUDED below — the list cannot
#                                             silently rot again)
#
#   KNOWN-RED, KEPT RUNNING ON PURPOSE (pre-existing debt, proven identical on
#   clean bf9e565 — do not drop, do not xfail, do not "make CI green" around them):
#     - test_evidence_writeback.py  3 failures (ApplyEvidenceTests x2,
#                                    LedgerColumnFidelity x1) — ledger-column
#                                    territory, owner TBD.
#     - test_merge_catalogs.py      1 failure (StagingFamilyMergeTests,
#                                    'unverified' != 'active').
#
#   Deliberately EXCLUDED — MACHINE-CHECKED by Fast_Fetch/test_ci_manifest.py:
#   every top-level Fast_Fetch/test_*.py must appear in a run step above or in
#   this block; a new test file matching neither fails CI. (Live audit: needs
#   the internet and would make CI flaky/non-deterministic. Per-site parser
#   tests: read fixture files whose layout changes with the site — run by the
#   scraper's own agent at edit time. The remaining feature suites were not
#   verified by this lane; unverified is not a green — promoting one to a run
#   step requires the owner proving it offline first.)
#     EXCLUDED: test_all_sites.py  — live 10-site network audit
#     EXCLUDED: test_10xflix_import.py  — per-site parser
#     EXCLUDED: test_7starhd_import.py  — per-site parser
#     EXCLUDED: test_9xmovies.py  — per-site parser
#     EXCLUDED: test_accounts.py  — owner not yet verified offline
#     EXCLUDED: test_accounts_api.py  — owner not yet verified offline
#     EXCLUDED: test_admin_panel.py  — owner not yet verified offline
#     EXCLUDED: test_audit_staging.py  — owner not yet verified offline
#     EXCLUDED: test_backfill_animated_flag.py  — owner not yet verified offline
#     EXCLUDED: test_backfill_tmdb.py  — owner not yet verified offline
#     EXCLUDED: test_bolly4u_import.py  — per-site parser
#     EXCLUDED: test_desicinemas.py  — per-site parser
#     EXCLUDED: test_download_endpoint.py  — owner not yet verified offline
#     EXCLUDED: test_filmyzilla_import.py  — per-site parser
#     EXCLUDED: test_hdhub4u_import.py  — per-site parser
#     EXCLUDED: test_hdtvb_import.py  — per-site parser
#     EXCLUDED: test_hindilinks4u.py  — per-site parser
#     EXCLUDED: test_hindilinks4u_retry.py  — per-site parser
#     EXCLUDED: test_import_katmoviehd.py  — per-site parser
#     EXCLUDED: test_katmoviehd.py  — per-site parser
#     EXCLUDED: test_katmoviehd_import.py  — per-site parser
#     EXCLUDED: test_media_search.py  — owner not yet verified offline
#     EXCLUDED: test_moviezguru.py  — per-site parser
#     EXCLUDED: test_multimovies_import.py  — per-site parser
#     EXCLUDED: test_operator_isolation.py  — owner not yet verified offline
#     EXCLUDED: test_payments.py  — owner not yet verified offline
#     EXCLUDED: test_rareanimes_import.py  — per-site parser
#     EXCLUDED: test_rogmovies_import.py  — per-site parser
#     EXCLUDED: test_ssrmovies_import.py  — per-site parser
#     EXCLUDED: test_toonworld4all.py  — per-site parser
#     EXCLUDED: test_vegamovies_import.py  — per-site parser
#     EXCLUDED: test_world4ufree_import.py  — per-site parser
#
# KNOWN FAILURE MODES THIS FILE FIXES
#   GitHub never ran any pipeline for this repo because the workflow files lived
#   in App/.github/workflows/ and radd-stream/.github/workflows/ — discovery
#   only happens at the true repository root. This file is at the root.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "Fast_Fetch/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Fast_Fetch/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: python3 -S offline suites
    runs-on: ubuntu-24.04   # system python 3.12 — same minor as the Oracle VM
    timeout-minutes: 25   # was 15; the suite list grew from 15 to 21 modules

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Interpreter report (no pip, no installs)
        run: |
          python3 --version
          echo "Runner system Python in use. This workflow must never pip-install."

      # One step per suite: a red X names the exact failing suite.
      - name: 🧪 test_database.py
        run: python3 -S Fast_Fetch/test_database.py

      - name: 🧪 test_vidout.py
        run: python3 -S Fast_Fetch/test_vidout.py

      - name: 🧪 test_catalog_v2.py
        run: python3 -S Fast_Fetch/test_catalog_v2.py

      - name: 🧪 test_release_descriptor.py
        run: python3 -S Fast_Fetch/test_release_descriptor.py

      - name: 🧪 test_link_health.py
        run: python3 -S Fast_Fetch/test_link_health.py

      - name: 🧪 test_link_state.py
        run: python3 -S Fast_Fetch/test_link_state.py

      - name: 🧪 test_evidence_writeback.py
        run: python3 -S Fast_Fetch/test_evidence_writeback.py

      # The HTTP edge is the product's privacy boundary, so it is guarded in CI by
      # the same rule as the data layer: every suite below ran clean offline on the
      # Oracle VM (python 3.12, -S, zero pip) before being added here.
      - name: 🧪 test_api_v2.py
        run: python3 -S Fast_Fetch/test_api_v2.py

      - name: 🧪 test_redact.py
        run: python3 -S Fast_Fetch/test_redact.py

      - name: 🧪 test_tiers.py
        run: python3 -S Fast_Fetch/test_tiers.py

      - name: 🧪 test_catalog_api.py
        run: python3 -S Fast_Fetch/test_catalog_api.py

      - name: 🧪 test_provenance_stamping.py
        run: python3 -S Fast_Fetch/test_provenance_stamping.py

      - name: 🧪 test_merge_catalogs.py
        run: python3 -S Fast_Fetch/test_merge_catalogs.py

      - name: 🧪 test_site_scout.py
        run: python3 -S Fast_Fetch/test_site_scout.py

      - name: 🧪 test_backup_manager.py
        run: python3 -S Fast_Fetch/test_backup_manager.py

      # Phase-1 modules (crown order qoder12_cigate): all offline, zero network,
      # each verified on the Oracle VM (python 3.12, -S) before being listed here.
      - name: 🧪 test_resolved_cache.py
        run: python3 -S Fast_Fetch/test_resolved_cache.py

      - name: 🧪 test_host_classifier.py
        run: python3 -S Fast_Fetch/test_host_classifier.py

      - name: 🧪 test_catalog_exporter.py
        run: python3 -S Fast_Fetch/test_catalog_exporter.py

      - name: 🧪 test_domain_resolver.py
        run: python3 -S Fast_Fetch/test_domain_resolver.py

      - name: 🧪 test_fast_fetch_domains.py
        run: python3 -S Fast_Fetch/test_fast_fetch_domains.py

      # The manifest gate goes last: it reads this file and fails if the real
      # suite list and the disk have drifted — including if THIS step itself
      # were ever removed.
      - name: 🧪 test_ci_manifest.py
        run: python3 -S Fast_Fetch/test_ci_manifest.py
