      # ATTRIBUTION, corrected under order qoder12_ci_retarget with the crown's own
      # numbers: test_evidence_writeback.py (3 failures) and test_merge_catalogs.py
      # (1 failure) were carried for days as "pre-existing repo debt, red at clean
      # bf9e565". WRONG. On trunk b99814e both are GREEN (hosted run 41156831610:
      # 39/39 steps success, recorded in trunk's checkpoint
      # Fast_Fetch/checkpoints/20261031-q5-adultkey-production-is-pre-law.md), and
      # test_evidence_writeback.py is byte-identical between trunk and this fork.
      # Measured cause of the fork-only reds, 2026-11-05:
      #   * evidence_writeback — Fast_Fetch/catalog_v2.py `_link_state_of()`:
      #     trunk folds the wide scraper status 'unverified' into the closed
      #     cat_links vocabulary ('' / unverified / active -> unchecked, measured
      #     active stays active); this fork predates that fix and projects the
      #     raw 'unverified'. Taking trunk's catalog_v2.py clears all three.
      #   * merge_catalogs — the TEST file itself: trunk's test_merge_catalogs.py
      #     was rewritten to assert the honest absence (`src["status"] ==
      #     "unverified"`, "a merged source nobody probed must not claim
      #     'active'"); the fork still asserts 'active'. Trunk's version clears it.
      # So neither step is xfail/skip material and neither is eternal debt: the
      # fix comes by taking trunk's version at merge time, NOT by deleting or
      # muting the step. They stay hard steps with if: always() below.

      - name: 📋 Step results — every suite on one line (a red must never hide the tail)
        if: always()
        env:
          RADD_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 -S - <<'PYEOF'
          import json, os
          results = json.loads(os.environ.get("RADD_STEP_RESULTS") or "{}")
          failed = 0
          for step_id in sorted(results):
              outcome = results[step_id].get("outcome", "?")
              if outcome not in ("success", "skipped"):
                  failed += 1
              print(f"{outcome:12} {step_id}")
          print(f"TOTAL {len(results)} steps, {failed} not green "
                "(missing-file reds name this branch's fork gap, not code failures)")
          PYEOF
