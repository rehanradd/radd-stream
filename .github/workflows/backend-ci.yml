name: 🐍 Backend CI — Stdlib Python Tests

# WHAT THIS DOES
#   Protects the Fast_Fetch data layer with the same rigor as the app: runs the
#   offline suites below on a plain ubuntu runner using the system python3
#   with -S and NO pip install whatsoever (stdlib-only is project law; if a
#   suite ever needs pip, that is a regression of the law, not of the runner).
#
#   Suites run (verified passing offline on the Oracle VM, python 3.12, before
#   this workflow was written):
#     - Fast_Fetch/test_database.py          (catalog/DB + adult filtering)
#     - Fast_Fetch/test_vidout.py            (VIDOUT extractor tests)
#     - Fast_Fetch/test_catalog_v2.py        (v2 catalog projection)
#     - Fast_Fetch/test_release_descriptor.py(release descriptor parsing)
#     - Fast_Fetch/test_link_health.py       (link health prober; binds a
#                                             throwaway HTTP server on 127.0.0.1
#                                             only — NO external network)
#     - Fast_Fetch/test_link_state.py        (ledger verdicts + cat_links propagation)
#     - Fast_Fetch/test_evidence_writeback.py(probe evidence folded onto cat_links)
#     - Fast_Fetch/test_api_v2.py            (every /api/v2 route head)
#     - Fast_Fetch/test_redact.py            (deny-by-default provenance edge)
#     - Fast_Fetch/test_tiers.py             (one winner per quality band)
#     - Fast_Fetch/test_catalog_api.py       (v1 read layer)
#     - Fast_Fetch/test_provenance_stamping.py(ingest-time provenance)
#     - Fast_Fetch/test_merge_catalogs.py    (staging → unified merge)
#     - Fast_Fetch/test_site_scout.py        (site discovery / spec phases)
#     - Fast_Fetch/test_backup_manager.py    (offsite backup tooling)
#     - Fast_Fetch/test_usage_stats.py       (operator counters + token gate)
#     - Fast_Fetch/test_operator_isolation.py(two real loopback servers, socket-level
#       routing — the layer every other suite calls as a function)
#     - Fast_Fetch/test_media_search.py      (by-media matcher: the bounded candidate
#       window, the no-SQL floor on short tokens, EXPLAIN QUERY PLAN assertions)
#     - Fast_Fetch/test_migrate_search_indexes.py (the reviewed index migration: writes
#       nothing without --execute, is idempotent, and fails verify on a drifted index)
#     - Fast_Fetch/test_adult_twin_probe.py     (the adult-twin exposure count: works vs
#       rows, NULL keys are not twins, and the grouping read stays in the key index)
#     - Fast_Fetch/test_posts_query_plan.py     (/api/v1/posts?q= EXPLAIN QUERY PLAN
#       evidence: two SCAN p passes, the join indexes that already exist in production,
#       and the unescaped/no-floor `q=` correctness half)
#     - Fast_Fetch/test_admin_panel.py       (the operator surface itself: the settings
#       round-trip, the additive migration on an older row, the loopback/token gate on
#       every route, and the drift test between MONETIZATION_FIELDS and what
#       remote_config() publishes. Offline, tempfile fixtures, zero network.)
#     - Fast_Fetch/test_engagement.py        (the ad-cadence/coin/streak/pass ledger the
#       admin knobs write to: append-only coin ledger, the "0 means default" rule, and
#       the local-day boundaries. Offline, tempfile fixtures, zero network.)
#
#   Deliberately EXCLUDED:
#     - Fast_Fetch/test_all_sites.py  — live 10-site network audit; needs the
#       internet and would make CI flaky/non-deterministic.
#     - importers/test_<site>_import.py and importers/test_host_resolvers.py —
#       the per-site parser suites. They gate a parser against bytes captured
#       from someone else's website, so their value is concentrated in the edit
#       that changes that parser, and running them on every Fast_Fetch push
#       would tie a green light to third-party page shapes that nobody in that
#       push touched. They are run by the scraper's own lane at edit time, and
#       importers/test_import_fzmovies.py (72 tests, measured offline in 1.3 s
#       on 2026-10-30 — re-count it, do not trust this number) stays in that
#       class on purpose even though its fixtures
#       are inlined transcriptions and it needs no network — registering one
#       importer suite and not the other five would be a rule no one can state.
#
#   WHY admin_panel/engagement ARE NOT COVERED BY THAT EXCLUSION: the site-parser
#   carve-out is about fixtures that drift when *someone else's website* changes.
#   These two suites assert against our own code and our own row shape, so a red X
#   here is always a real regression and never a flake. They were unregistered and
#   undocumented from the day they were written, which is exactly the green-CI-with-
#   untested-surface state that bit this repo before; if either ever needs the
#   network, delete the step and leave a sentence here saying why.
#
# KNOWN FAILURE MODES THIS FILE FIXES
#   GitHub never ran any pipeline for this repo because the workflow files lived
#   in App/.github/workflows/ and radd-stream/.github/workflows/ — discovery
#   only happens at the true repository root. This file is at the root.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "Fast_Fetch/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Fast_Fetch/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: python3 -S offline suites
    runs-on: ubuntu-24.04   # system python 3.12 — same minor as the Oracle VM
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Interpreter report (no pip, no installs)
        run: |
          python3 --version
          echo "Runner system Python in use. This workflow must never pip-install."

      # One step per suite: a red X names the exact failing suite.
      - name: 🧪 test_database.py
        run: python3 -S Fast_Fetch/test_database.py

      - name: 🧪 test_vidout.py
        run: python3 -S Fast_Fetch/test_vidout.py

      - name: 🧪 test_catalog_v2.py
        run: python3 -S Fast_Fetch/test_catalog_v2.py

      - name: 🧪 test_release_descriptor.py
        run: python3 -S Fast_Fetch/test_release_descriptor.py

      - name: 🧪 test_link_health.py
        run: python3 -S Fast_Fetch/test_link_health.py

      - name: 🧪 test_link_state.py
        run: python3 -S Fast_Fetch/test_link_state.py

      - name: 🧪 test_evidence_writeback.py
        run: python3 -S Fast_Fetch/test_evidence_writeback.py

      # The HTTP edge is the product's privacy boundary, so it is guarded in CI by
      # the same rule as the data layer: every suite below ran clean offline on the
      # Oracle VM (python 3.12, -S, zero pip) before being added here.
      - name: 🧪 test_api_v2.py
        run: python3 -S Fast_Fetch/test_api_v2.py

      - name: 🧪 test_redact.py
        run: python3 -S Fast_Fetch/test_redact.py

      - name: 🧪 test_tiers.py
        run: python3 -S Fast_Fetch/test_tiers.py

      - name: 🧪 test_catalog_api.py
        run: python3 -S Fast_Fetch/test_catalog_api.py

      - name: 🧪 test_provenance_stamping.py
        run: python3 -S Fast_Fetch/test_provenance_stamping.py

      - name: 🧪 test_merge_catalogs.py
        run: python3 -S Fast_Fetch/test_merge_catalogs.py

      - name: 🧪 test_site_scout.py
        run: python3 -S Fast_Fetch/test_site_scout.py

      - name: 🧪 test_backup_manager.py
        run: python3 -S Fast_Fetch/test_backup_manager.py

      # The operator counters: aggregates-only schema proofs, the increment-on-write
      # rule, and the fail-closed token gate. Offline, stdlib, no network.
      - name: 🧪 test_usage_stats.py
        run: python3 -S Fast_Fetch/test_usage_stats.py

      # Two real servers on loopback and a real socket between them — the only suite
      # that can catch the operator-port gate being routed around rather than removed.
      - name: 🧪 test_operator_isolation.py
        run: python3 -S Fast_Fetch/test_operator_isolation.py

      # The by-media route's shape. The assertions that matter here are the ones that
      # fail if somebody puts a join or a sort back in front of the candidate cap:
      # `EXPLAIN QUERY PLAN` is captured inside the test, so a query that would take
      # 45 s on the production catalog is red on the runner in milliseconds.
      - name: 🧪 test_media_search.py
        run: python3 -S Fast_Fetch/test_media_search.py

      # The index migration, against a throwaway fixture catalog in a temp directory.
      # It never opens a real database; the target path is required on the command line.
      - name: 🧪 test_migrate_search_indexes.py
        run: python3 -S Fast_Fetch/test_migrate_search_indexes.py

      # Query-plan evidence for the findings in docs/SEARCH_LATENCY_FINDINGS.md. It
      # builds its own throwaway catalog because `catalog_v2.ensure_schema` does not
      # create `releases`/`download_sources` at all — the drift that made an earlier
      # "missing index" report measure a file that production is not.
      - name: 🧪 test_posts_query_plan.py
        run: python3 -S Fast_Fetch/test_posts_query_plan.py

      # The adult-twin probe from docs/ADULT_TWIN_PROBE.md. In-memory fixture only: the
      # production count is deliberately NOT taken here, because the file is 6.4 GB and
      # this runner is not allowed to decide when a heavy read is polite.
      - name: 🧪 test_adult_twin_probe.py
        run: python3 -S Fast_Fetch/test_adult_twin_probe.py

      # The operator surface. This is the suite that catches a MONETIZATION_FIELDS entry
      # with no matching column, a settings save that publishes a number the consumer will
      # silently clamp, a 0 override read back as "unlimited", an additive migration that
      # loses a saved value, and — the reason it is registered now — a remote_config()
      # body that no longer equals the projection the ledger itself publishes.
      - name: 🧪 test_admin_panel.py
        run: python3 -S Fast_Fetch/test_admin_panel.py

      # The engagement ledger behind those knobs: the coin ledger is append-only, a
      # rewarded grant is capped per local day, a streak bucket rolls at the configured
      # hour in the configured zone, and a pass price resolves from data rather than a
      # literal. Offline; every database is a tempfile.
      - name: 🧪 test_engagement.py
        run: python3 -S Fast_Fetch/test_engagement.py
