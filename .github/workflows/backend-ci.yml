name: 🐍 Backend CI — Stdlib Python Tests

# WHAT THIS DOES
#   Protects the Fast_Fetch data layer with the same rigor as the app: runs the
#   offline suites below on a plain ubuntu runner using the system python3
#   with -S and NO pip install whatsoever (stdlib-only is project law; if a
#   suite ever needs pip, that is a regression of the law, not of the runner).
#
#   Suites run (verified passing offline on the Oracle VM, python 3.12, before
#   this workflow was written):
#     - Fast_Fetch/test_database.py          (catalog/DB + adult filtering)
#     - Fast_Fetch/test_vidout.py            (VIDOUT extractor tests)
#     - Fast_Fetch/test_catalog_v2.py        (v2 catalog projection)
#     - Fast_Fetch/test_release_descriptor.py(release descriptor parsing)
#     - Fast_Fetch/test_link_health.py       (link health prober; binds a
#                                             throwaway HTTP server on 127.0.0.1
#                                             only — NO external network)
#     - Fast_Fetch/test_link_state.py        (ledger verdicts + cat_links propagation)
#     - Fast_Fetch/test_evidence_writeback.py(probe evidence folded onto cat_links)
#     - Fast_Fetch/test_api_v2.py            (every /api/v2 route head)
#     - Fast_Fetch/test_redact.py            (deny-by-default provenance edge)
#     - Fast_Fetch/test_tiers.py             (one winner per quality band)
#     - Fast_Fetch/test_catalog_api.py       (v1 read layer)
#     - Fast_Fetch/test_bundle_handles.py    (Session 111: bundle handles name ledger rows)
#     - Fast_Fetch/test_provenance_stamping.py(ingest-time provenance)
#     - Fast_Fetch/test_merge_catalogs.py    (staging → unified merge)
#     - Fast_Fetch/test_backfill_cast.py     (cast backfill: report-only by
#                                             default; --apply fills blanks from
#                                             staging by page URL, never overwrites)
#     - Fast_Fetch/test_site_scout.py        (site discovery / spec phases)
#     - Fast_Fetch/test_backup_manager.py    (offsite backup tooling)
#     - Fast_Fetch/test_usage_stats.py       (operator counters + token gate)
#     - Fast_Fetch/test_operator_isolation.py(two real loopback servers, socket-level
#       routing — the layer every other suite calls as a function)
#     - Fast_Fetch/test_media_search.py      (by-media matcher: the bounded candidate
#       window, the no-SQL floor on short tokens, EXPLAIN QUERY PLAN assertions)
#     - Fast_Fetch/test_home_rails.py        (Home rails: /api/v1/trending,
#       /api/v1/related, /api/v1/facets, and the genre/language filters)
#     - Fast_Fetch/test_works_api.py         (the work-centric API: /api/v1/works
#       list/detail — read-time grouping of posts into one work per
#       movie/series, season/episode normalisation, the episode guide
#       with gaps and pack-covered gaps, language buckets, region
#       filters, the poor-match did_you_mean, and the corroborated
#       work-level adult rule)
#     - Fast_Fetch/test_migrate_search_indexes.py (the reviewed index migration: writes
#       nothing without --execute, is idempotent, and fails verify on a drifted index)
#     - Fast_Fetch/test_fts_posts.py      (the FTS5 search index over posts: fts_posts
#       + fts_posts_tri, the works search swap point, the trigram correction layer with
#       Damerau transpositions and exact-title evidence ranking, and the LIKE fallback)
#     - Fast_Fetch/test_bounded_ledger.py    (/api/data: page ceiling, operator-only
#       stats=full, and a scan-free default path proven by a trace callback)
#     - Fast_Fetch/test_project_readonly.py  (v2 rebuild over an ATTACHed mode=ro ledger:
#       source sha256 unchanged, zero link loss, safe stamps written)
#     - Fast_Fetch/test_link_sweep_budget.py    (the link-health sweep's budget maths:
#       probe cost, why a full 3.7 M sweep is infeasible, sample sizes and margins — pure
#       arithmetic over link_health's own constants, no sockets, no catalog read)
#     - Fast_Fetch/importers/test_themoviebox_links.py (the MovieBox rendition/mirror
#       rules: one release per declared tier with no invented URL, a dead mirror stored
#       dead, an adult label that survives a linkless page, and the zero-source post
#       that must stay visible. Offline, devalue-encoded fixtures, in-memory SQLite)
#     - Fast_Fetch/importers/test_themoviebox_detail_api.py (the MovieBox detail-API
#       parser: stars[] -> cast/director/writers with per-season duplicates collapsed,
#       dubs[] split into audio vs subtitles, a stills object becoming the backdrop,
#       seasons stamped after the declared tiers land, keywords kept, trailer never a
#       source. Offline fixture from the captured public detail answer)
#     - Fast_Fetch/test_adult_twin_probe.py     (the adult-twin exposure count: works vs
#       rows, NULL keys are not twins, and the grouping read stays in the key index)
#     - Fast_Fetch/importers/test_dub_collision_census.py (the dub-collision query: two
#       prints of one work can only share a title+year key ACROSS staging vaults, because
#       each vault declares `canonical_key` PRIMARY KEY/UNIQUE; divergence is a normalized
#       language-set comparison, not COUNT(DISTINCT), and the adult-twin verdict needs a
#       flagged row beside a clean one under one key. Offline in-memory fixtures)
#     - Fast_Fetch/test_posts_query_plan.py     (/api/v1/posts?q= EXPLAIN QUERY PLAN
#       evidence: two SCAN p passes, the join indexes that already exist in production,
#       and the unescaped/no-floor `q=` correctness half)
#     - Fast_Fetch/test_admin_panel.py          (the operator panel's write gate: the
#       loopback/remote peer rule, the closed admin-only verb vocabulary, refusing a
#       field the edge would rewrite, refusing a non-numeric price, and writing nothing
#       on refusal. Offline against a temp-file fixture catalog. MEASURED, and it
#       settles why this box was the wrong judge: the same 65 tests are 266.312 s here
#       at load 6.9 and 1 s on the hosted runner (run 40954291359, step 21:03:47 ->
#       21:03:48, success). The suite blocks on I/O under contention, not on compute —
#       so a slow local module is not a slow module, and CI's timing is the record.)
#     - Fast_Fetch/test_host_serialiser.py      (the per-host politeness gate: a fetch
#       that ran while its host lock was free, two requests to one host in flight
#       together, a host wedged after an exception, or two hosts serialising as a global
#       stop all fail this. Offline and deterministic — 18 tests, no stopwatch needed)
#     - Fast_Fetch/test_docs_invariants.py   (the documentation diet's guard: every law sentence is
#       still in the file every agent auto-loads, the rotated history and SPEC destinations exist,
#       no relative link in a trimmed doc dangles, and the byte ceilings hold. Offline, markdown only)
#     - Fast_Fetch/test_operator_read_bounds.py (the operator's own reads: the ledger page is capped
#       and says so (`page.truncated` / `page.clamped`), /api/sitemap's row cap is enforced in the
#       function that touches SQL and a nonsense `?limit=` answers 200 not 500, a bogus bearer token
#       gets 401 on every route of the operator port and no credential gets the identical body, and
#       the public allow-list is byte-for-byte unchanged. Offline: temp SQLite + two real loopback
#       servers on port 0 — no network, no production catalog)
#     - Fast_Fetch/test_engagement_ladder.py (the pass ladder is data: a tier names its own expiry
#       rule, no code compares a plan to a tier name (checked by `ast`), a malformed tier refuses
#       and writes NOTHING rather than spending coins and minting nothing, a fourth tier is an edit
#       to `PASS_LADDER` alone, the price the panel publishes is the price the wallet is debited,
#       and every money and coin field is an `int`. Offline against a temp user-state DB)
#     - Fast_Fetch/test_engagement.py        (the ad-cadence/coin/streak/pass ledger the
#       admin knobs write to: the append-only coin ledger, the "0 means default" rule,
#       and the local-day boundaries. Offline, tempfile fixtures, zero network. It was
#       the unregistered half of the pair — test_admin_panel.py got its step on
#       `396e476`; this suite asserts the semantics the panel's knobs hand to that
#       ledger, so registering one without the other left the write gate gated and the
#       thing it writes unjudged.)
#     - Fast_Fetch/test_operator_adult_projection.py (the adult rule on the operator's own read: a
#       flagged row's ledger JSON carries no `source_url`/`final_url`/`resource_id`/
#       `intermediate_url` and no upstream file address reaches the wire, while the flag, the hoster
#       name, the status and the health stay for the audit; an unflagged row loses nothing; the badge
#       stays operator-only; and over a real loopback socket a flagged source id is refused before
#       the resolver runs. Offline — temp catalog, 127.0.0.1 port 0, no network)
#
#   Deliberately EXCLUDED:
#     - Fast_Fetch/test_all_sites.py  — live 10-site network audit; needs the
#       internet and would make CI flaky/non-deterministic.
#     - importers/test_<site>_import.py and importers/test_host_resolvers.py —
#       the per-site parser suites. They gate a parser against bytes captured
#       from someone else's website, so their value is concentrated in the edit
#       that changes that parser, and running them on every Fast_Fetch push
#       would tie a green light to third-party page shapes that nobody in that
#       push touched. They are run by the scraper's own lane at edit time, and
#       importers/test_import_fzmovies.py (72 tests, measured offline in 1.3 s
#       on 2026-10-30 — re-count it, do not trust this number) stays in that
#       class on purpose even though its fixtures are inlined transcriptions and
#       it needs no network: registering one importer suite and not the other
#       five would be a rule no one can state.
#
#   WHY admin_panel/engagement ARE NOT COVERED BY THAT EXCLUSION: the site-parser
#   carve-out is about fixtures that drift when *someone else's website* changes.
#   These two suites assert against our own code and our own row shape, so a red X
#   here is always a real regression and never a flake. They were unregistered and
#   undocumented from the day they were written, which is exactly the green-CI-with-
#   untested-surface state that bit this repo before; if either ever needs the
#   network, delete the step and leave a sentence here saying why.
#
#   ONE CONSEQUENCE OF REGISTERING test_database.py THAT EVERY LANE SHOULD KNOW.
#   test_database.py does not only test the database: it AST-walks every *.py under
#   Fast_Fetch/ and fails if any `*ADULT*` list literal anywhere in the tree contains
#   a version word (uncut/unrated/extended/…), because a version word in an adult list
#   hides mainstream works behind a flag no public surface can undo. So adding a new
#   file — an importer, say, in a directory test_database.py never imports — can break
#   a CI module that has no other relationship to your change, and the red X names
#   test_database.py. Measured: the fzmovies importer's "uncut" did exactly this on
#   2026-10-30 — at a base where the workflow had 23 steps, 22 came back green and
#   test_database.py was the one red, with the failure naming a module the importer
#   never imports.
#
#
#   MACHINE-READABLE EXCLUSION BLOCK (parsed by Fast_Fetch/test_ci_manifest.py
#   — the drift guard). One line per top-level Fast_Fetch/test_*.py that is
#   deliberately NOT a CI step. A new test file that appears in neither this
#   block nor a run: step fails the guard: silence both ways is rot.
#     EXCLUDED: test_all_sites.py  — live 10-site network audit; needs the internet
#     EXCLUDED: test_10xflix_import.py  — per-site parser
#     EXCLUDED: test_7starhd_import.py  — per-site parser
#     EXCLUDED: test_9xmovies.py  — per-site parser
#     EXCLUDED: test_audit_staging.py  — owner not yet verified offline
#     EXCLUDED: test_backfill_animated_flag.py  — operator migration, not a suite
#     EXCLUDED: test_bolly4u_import.py  — per-site parser
#     EXCLUDED: test_desicinemas.py  — per-site parser
#     EXCLUDED: test_filmyzilla_import.py  — per-site parser
#     EXCLUDED: test_hdhub4u_import.py  — per-site parser
#     EXCLUDED: test_hdtvb_import.py  — per-site parser
#     EXCLUDED: test_hindilinks4u.py  — per-site parser
#     EXCLUDED: test_hindilinks4u_retry.py  — per-site parser
#     EXCLUDED: test_import_katmoviehd.py  — per-site parser
#     EXCLUDED: test_katmoviehd.py  — per-site parser
#     EXCLUDED: test_katmoviehd_import.py  — per-site parser
#     EXCLUDED: test_moviezguru.py  — per-site parser
#     EXCLUDED: test_multimovies_import.py  — per-site parser
#     EXCLUDED: test_rareanimes_import.py  — per-site parser
#     EXCLUDED: test_rogmovies_import.py  — per-site parser
#     EXCLUDED: test_ssrmovies_import.py  — per-site parser
#     EXCLUDED: test_toonworld4all.py  — per-site parser
#     PROMOTED (this line replaces the old hold entry, which the guard's EXCLUDED_RE
#     would otherwise read as a live exclusion and call an overlap):
#     test_transient_dead_heal.py — NO LONGER EXCLUDED. History: it was UNTRACKED qoder13
#       work sitting in the lane worktree (same class as test_fast_fetch_domains.py was at
#       96c689e) and the old line was the honest hold, not a mute; the hold's own rule was
#       "its owner must commit it, then it gets a real step", it committed tracked at
#       1cfea81, and the step below is that promotion.
#     EXCLUDED: test_vegamovies_import.py  — per-site parser
#     EXCLUDED: test_world4ufree_import.py  — per-site parser
#     Widened under order qoder12_ci_manifest_widen (2026-11-05): the guard's
#     accounting used to glob TOP LEVEL ONLY, which is why every importers/
#     suite below was named nowhere and nothing complained. Each now carries an
#     explicit human-chosen line — a per-module decision, never a pattern that
#     auto-excludes a directory. (The two importers RESOLVER suites that are
#     offline-green got real run steps instead: test_host_resolvers.py, 171
#     tests, and test_stream_resolvers.py, 45 tests, both verified offline on
#     this lane before promotion.)
#     EXCLUDED: importers/test_5movierulz_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_animahd_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_aryplus_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_desiserials_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_dramacool_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_filmiyin_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_filmyhit_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_filmywap_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_import_humtv.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_import_fzmovies.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_import_wp_family.py  — per-site parser family (captured Dooplay/WP page shapes, offline fixtures)
#     EXCLUDED: importers/test_kisskh_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_kuttymovies_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_levidia_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_moviecok_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_moviesmela_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#     EXCLUDED: importers/test_pagalmovies_import.py  — per-site parser; fixture layout follows the site, run by that site's own agent at edit time
#
# KNOWN FAILURE MODES THIS FILE FIXES
#   GitHub never ran any pipeline for this repo because the workflow files lived
#   in App/.github/workflows/ and radd-stream/.github/workflows/ — discovery
#   only happens at the true repository root. This file is at the root.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "Fast_Fetch/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Fast_Fetch/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: python3 -S offline suites
    runs-on: ubuntu-24.04   # system python 3.12 — same minor as the Oracle VM
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + all branches: the ci-manifest guard reads
          # origin/main (TRUNK_REF) to prove this file never drops a trunk
          # suite. A depth-1 single-branch checkout has no trunk ref at
          # all, and the guard fails loudly rather than passing blind.
          fetch-depth: 0

      - name: 🐍 Interpreter report (no pip, no installs)
        run: |
          python3 --version
          echo "Runner system Python in use. This workflow must never pip-install."

      # One step per suite: a red X names the exact failing suite.
      # First, deliberately: a lane cut at `b99814e` that ports whole files rather than diffs silently
      # reverts the hubcdn gate, the paging window and the backup disk guards, and every behaviour suite
      # below stays green because the code it tests is still there. This one tests that what landed is
      # still in the tree. Measured: 7 OK at `f3849b8`, FAILED (failures=5) at `b99814e`.
      - name: 🧪 test_trunk_continuity.py
        run: python3 -S Fast_Fetch/test_trunk_continuity.py

      - name: 🧪 test_database.py
        run: python3 -S Fast_Fetch/test_database.py

      - name: 🧪 test_vidout.py
        run: python3 -S Fast_Fetch/test_vidout.py

      - name: 🧪 test_catalog_v2.py
        run: python3 -S Fast_Fetch/test_catalog_v2.py

      - name: 🧪 test_release_descriptor.py
        run: python3 -S Fast_Fetch/test_release_descriptor.py

      - name: 🧪 test_link_health.py
        run: python3 -S Fast_Fetch/test_link_health.py

      - name: 🧪 test_link_state.py
        run: python3 -S Fast_Fetch/test_link_state.py

      - name: 🧪 test_evidence_writeback.py
        run: python3 -S Fast_Fetch/test_evidence_writeback.py

      - name: 🧪 test_live_tv.py
        run: python3 -S Fast_Fetch/test_live_tv.py

      # The HTTP edge is the product's privacy boundary, so it is guarded in CI by
      # the same rule as the data layer: every suite below ran clean offline on the
      # Oracle VM (python 3.12, -S, zero pip) before being added here.
      - name: 🧪 test_api_v2.py
        run: python3 -S Fast_Fetch/test_api_v2.py

      - name: 🧪 test_redact.py
        run: python3 -S Fast_Fetch/test_redact.py

      # Socket-level download twin of /api/v1/stream: the 302, the JSON
      # descriptor, the shortener waterfall, the credit path and the 720p
      # free cap. Offline — temp ledger, loopback servers, no catalog read.
      - name: 🧪 test_download_endpoint.py
        run: python3 -S Fast_Fetch/test_download_endpoint.py

      # Two public-edge decisions, pinned: the /api/v1/posts offset window (a pair of
      # values that each satisfy bounded_int can still ask SQLite to walk OFFSET
      # 99,999,900), and which artwork hosts may be named in public. Offline — temp
      # ledger, loopback servers, no catalog read.
      - name: 🧪 test_edge_phase1.py
        run: python3 -S Fast_Fetch/test_edge_phase1.py

      - name: 🧪 test_tiers.py
        run: python3 -S Fast_Fetch/test_tiers.py

      - name: 🧪 test_catalog_api.py
        run: python3 -S Fast_Fetch/test_catalog_api.py

      # Session 111: a v2 bundle handle names a ledger row, never the
      # projected cat id — the bundle's own handle pressed through a real
      # /api/v1/stream socket server (loopback media file, real resolver),
      # plus the NULL-ledger shape and the /resolve + /feed.m3u guards.
      - name: 🧪 test_bundle_handles.py
        run: python3 -S Fast_Fetch/test_bundle_handles.py

      - name: 🧪 test_provenance_stamping.py
        run: python3 -S Fast_Fetch/test_provenance_stamping.py

      - name: 🧪 test_merge_catalogs.py
        run: python3 -S Fast_Fetch/test_merge_catalogs.py

      - name: 🧪 test_backfill_cast.py
        run: python3 -S Fast_Fetch/test_backfill_cast.py

      # TMDB/Cinemeta artwork backfill (A1 poster re-resolve): offline, stdlib,
      # fake HTTP client, temp-file DB, no network.
      - name: 🧪 test_backfill_tmdb.py
        run: python3 -S Fast_Fetch/test_backfill_tmdb.py

      # The resolved-link cache (Session 123, scale plan B2): lazy-first
      # freshness reads over the ledger row + the top-200 eager warmer.
      # Offline, stdlib, in-memory fixture, no network.
      - name: 🧪 test_resolved_link_cache.py
        run: python3 -S Fast_Fetch/test_resolved_link_cache.py

      # Phase-1 resolved cache (feat/phase1-resolved-cache, rebased onto
      # main 14d9063): the request-path cache the viewer reads first and
      # banks into — `resolved_cache` is authoritative on the read path and
      # the B2 `resolved_link_cache` above stays as-is. The seven steps
      # below are the branch's modules registered onto main's CI file (the
      # branch's own file is an older 52-suite list and must not be taken).
      # Offline, stdlib, in-memory/scratch fixtures, no network.
      - name: 🧪 test_resolved_cache.py
        run: python3 -S Fast_Fetch/test_resolved_cache.py

      # Gap A7 (prefetch run mode): the worker + its systemd timer/service +
      # runbook, tested offline against a scratch DB with a stubbed resolver.
      # Offline, stdlib, in-memory/scratch fixtures, no network.
      - name: 🧪 test_prefetch_worker.py
        run: python3 -S Fast_Fetch/test_prefetch_worker.py

      # Gap A17 (blank-year backfill from the title) + A18 (genre-category
      # backfill into the panel's category_works) + A20 (fleet worker +
      # systemd timer/service + runbook). Offline, stdlib, temp-file DBs,
      # no network; the live runs are parent-gated with a backup first.
      - name: 🧪 test_backfill_year_from_title.py
        run: python3 -S Fast_Fetch/test_backfill_year_from_title.py

      - name: 🧪 test_backfill_categories.py
        run: python3 -S Fast_Fetch/test_backfill_categories.py

      - name: 🧪 test_fleet_worker.py
        run: python3 -S Fast_Fetch/test_fleet_worker.py

      - name: 🧪 test_catalog_exporter.py
        run: python3 -S Fast_Fetch/test_catalog_exporter.py

      - name: 🧪 test_transient_dead_heal.py
        run: python3 -S Fast_Fetch/test_transient_dead_heal.py

      - name: 🧪 test_probe_coverage.py
        run: python3 -S Fast_Fetch/test_probe_coverage.py

      - name: 🧪 test_fast_fetch_domains.py
        run: python3 -S Fast_Fetch/test_fast_fetch_domains.py

      - name: 🧪 importers/test_stream_resolvers.py
        run: python3 -S Fast_Fetch/importers/test_stream_resolvers.py

      - name: 🧪 test_ci_manifest.py
        run: python3 -S Fast_Fetch/test_ci_manifest.py

      # Scheduled maintenance inside serve (Session 123): the bounded
      # propagate + warm + heal tick, env-gated, memory-floor guarded.
      # Offline, stdlib, injected fakes, no network.
      - name: 🧪 test_maintenance.py
        run: python3 -S Fast_Fetch/test_maintenance.py

      # The FTS5 search index (Session 123): standalone table over the
      # normalised title/original-title/genres/aliases haystack, rebuilt by
      # the projector. Offline, stdlib, in-memory fixture, no network.
      - name: 🧪 test_fts_search.py
        run: python3 -S Fast_Fetch/test_fts_search.py

      # The FTS5 search index over posts (search-performance benchmark,
      # 2026-11-12): fts_posts (clean_title + cast_names) behind the
      # works search swap point, fts_posts_tri behind the trigram
      # correction layer (Damerau transpositions, exact-title evidence
      # ranking), and the LIKE fallback when the index is absent.
      # Offline, stdlib, temp SQLite fixtures; no network.
      - name: 🧪 test_fts_posts.py
        run: python3 -S Fast_Fetch/test_fts_posts.py

      # Scale quick wins (Session 125): the serve-path pragmas in one
      # helper + every call site applying them, the search limit clamp,
      # the 10 s search deadline and the 503 `search_timeout` branch.
      # Offline, stdlib, tempfile fixtures; loopback only for the 503 proof.
      - name: 🧪 test_scale_pragmas.py
        run: python3 -S Fast_Fetch/test_scale_pragmas.py

      - name: 🧪 test_site_scout.py
        run: python3 -S Fast_Fetch/test_site_scout.py

      - name: 🧪 test_backup_manager.py
        run: python3 -S Fast_Fetch/test_backup_manager.py

      # The operator counters: aggregates-only schema proofs, the increment-on-write
