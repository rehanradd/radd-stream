      # /home/ubuntu without letting the job stat it, importing anything that reads `config` ends the
      # job before its first assertion — the failure measured at q2's `eb4c0ee`: PermissionError at
      # 0.2 s, every later step skipped, while the identical line on trunk was green an hour earlier
