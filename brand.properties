# =============================================================================
#  brand.properties — THE ONE BRAND FILE for radd-stream (Android + Python)
# =============================================================================
#  Re-skin the whole product (app name, logo colours, scheme, version, copy),
#  rebuild the APK and restart the server. That is the entire procedure.
#
#  Consumers (both parse THIS file, natively, with zero new dependencies):
#    * App/app/build.gradle.kts  -> java.util.Properties
#          -> BuildConfig.BRAND_<KEY uppercased, '.' -> '_'>
#          -> resValue("color", ...) / resValue("string", ...)
#          -> manifestPlaceholder "brandScheme"
#          -> build/generated/assets/brand/brand.json  (never hand-edited)
#    * App/settings.gradle.kts   -> java.util.Properties (rootProject.name)
#    * Fast_Fetch/config.py      -> configparser (PROJECT_* + BRAND_* consts)
#    * App/app/src/test/kotlin/.../BrandDriftTest.kt (guards against drift)
#
#  FORMAT RULES — every rule exists because two parsers must agree:
#    1. flat `key=value`, one per line, no line continuations (`\` at EOL).
#    2. keys are globally unique AND fully qualified: the section prefix is
#       repeated inside the key (identity.name lives under [identity]).
#       `[section]` headers are grouping for Python configparser; the Gradle
#       side skips any key that starts with '['.
#    3. values must contain no '%' (Python interpolation) and no trailing ';'.
#    4. colours are '#RRGGBB' or '#AARRGGBB'. Kotlin/Compose reads them from
#       BuildConfig strings; AAPT reads them from resValue("color", ...).
#    5. booleans are 'true'/'false'; sizes are plain integers (bytes/seconds).
#
#  WHAT CANNOT COME FROM THIS FILE (honest limits, see App/AGENTS.md §15):
#    a) Binary PNG launcher mipmaps (mipmap-{m,h,xh,xxh,xxxh}dpi/ic_launcher*.png)
#       — pixel bitmaps are not text. The vector adaptive icon
#       (mipmap-anydpi-v26 + drawable/ic_launcher_*.xml) is brand-driven.
#    b) Manifest-registered components (activities, services, permissions) —
#       AGP requires them literally in AndroidManifest.xml. Brand drives only
#       their label / icon / theme / deep-link scheme through generated values.
# =============================================================================

# ── 1. IDENTITY ──────────────────────────────────────────────────────────────
[identity]
identity.name=RADD Stream
identity.name.short=Radd Stream
identity.name.wordmark.first=Radd
identity.name.wordmark.second=Stream
identity.tagline=Deep water. One current.
identity.application.id=com.raddstream.app
identity.application.id.debug.suffix=.debug
identity.namespace=com.raddstream.app
identity.version.name=0.1.0
identity.version.code=1
identity.copyright=© 2026 radddao — metadata catalog client

# ── 2. SERVER (Python backend identity) ──────────────────────────────────────
# config.py re-exports these as PROJECT_NAME / PROJECT_VERSION /
# PROJECT_DESCRIPTION / PROJECT_GITHUB so every existing importer keeps working.
[server]
server.project.name=radd-stream
server.project.version=3.1.0
server.project.description=World #1 universal streaming scraper & SQLite database engine
server.project.github=https://github.com/radddao/radd-stream
server.database.filename=fast_fetch.db
server.env.prefix=RADD_

