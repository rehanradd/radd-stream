# ── 5. LAUNCHER / RESOURCE-SIDE COLOURS ──────────────────────────────────────
# These keys are emitted verbatim as resValue("color", "<key>") so XML
# (themes.xml, drawable/ic_launcher_*.xml) can reference @color/<key>.
# They are names, not new paint: each mirrors a value from the ramps above.
[resources.colors]
resources.colors.radd_ink_void=#040708
resources.colors.radd_ink_950=#06090B
resources.colors.radd_ink_900=#0E1518
resources.colors.radd_ink_850=#141D20
