# ── 6. SCHEME BEHAVIOUR + TYPOGRAPHY ─────────────────────────────────────────
[scheme]
scheme.default_dark=true
scheme.dynamic_color_default=false
scheme.name=Current and Undertow

[typography]
typography.display_family=sansserif
typography.text_family=sansserif
typography.scale=1.0
typography.display_large=40
typography.headline_large=24
typography.title_large=17
typography.body_large=16
typography.body_medium=14
typography.label_small=11
typography.min_safe_size=11

# ── 7. COPY STRINGS (user-visible prose) ─────────────────────────────────────
[copy]
copy.brand_lockup_subtitle=Source-link catalog browser
copy.home_title=RADD Stream
copy.settings_about_heading=About RADD Stream
copy.settings_about_body=RADD Stream is a metadata catalog browser and source-link resolver for a catalog server you operate or are authorized to use. It aggregates public catalog metadata and resolves source links; it is not a hosting service and it does not display 18+ content.
copy.share_template=Check out "{title}" in RADD Stream.
copy.offline_notice=Kept files are encrypted for this device and can be played only inside RADD Stream.
copy.cache_locked_notice=Playable in RADD Stream only
copy.setup_heading=Connect to Server
copy.disclaimer_line=18+ content is flagged at storage time and never displayed.

# ── 8. DEEP LINK + USER AGENT ────────────────────────────────────────────────
[deeplink]
deeplink.scheme=radd
deeplink.host.browse=browse
deeplink.host.detail=detail

[network]
network.user_agent.product=RaddStream
network.user_agent.version_suffix=Android Media3
network.client_name=radd-stream-android

# ── 9. FEATURE FLAGS ─────────────────────────────────────────────────────────
[features]
features.offline_cache=true
features.artwork_accent=true
features.adult_filter_enforced=true
features.external_player_fallback=true
features.pip=true
features.light_scheme=false
features.dynamic_color=false
features.server_stats_dashboard=true

# ── 10. CACHE TTLs (seconds) ─────────────────────────────────────────────────
# Consumed by BuildConfig/Brand on the app side and by config.BRAND_TTL on the
# server side. Kept here so a re-skin cannot silently change data freshness.
[cache]
cache.ttl.catalog_seconds=3600
cache.ttl.artwork_days=7
cache.ttl.stream_url_seconds=1800
cache.ttl.endpoint_probe_minutes=30
cache.ttl.temp_link_grace_minutes=20
cache.ttl.search_debounce_ms=300

# ── 11. STORAGE LIMITS (bytes unless stated) ─────────────────────────────────
[storage]
storage.offline_max_bytes=17179869184
storage.per_file_max_bytes=10737418240
storage.low_space_warning_bytes=1073741824
storage.ahead_fetch_max_bytes_per_pass=268435456
storage.catalog_row_limit=2000
storage.http_timeout_seconds=25
storage.http_retries=3
